# The one definition of the lint step: `make lint` (and so `make check` and CI) runs these hooks on every file, and
# `uv run pre-commit install` runs them on each commit's staged files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Ruff and mypy run through uv, so the versions are the ones in uv.lock: there is no second pin to drift.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint, import sorting, import bans)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
