[project]
name = "northdesk"
version = "0.1.0"
description = "Agentic support-ticket workflow on FastAPI and Temporal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.2,<3",
    "temporalio>=1.34.0,<2",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
# Two top-level packages (northdesk, helpdesk) run from the repo root; nothing is built or published.
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "DTZ", "FAST", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Only northdesk/main.py and northdesk/api/ may import FastAPI."
"starlette".msg = "Only northdesk/main.py and northdesk/api/ may import Starlette."
"temporalio".msg = "Only northdesk/workflows/, northdesk/main.py and northdesk/api/ may import Temporal."

[tool.ruff.lint.per-file-ignores]
# The HTTP edge owns FastAPI and holds the Temporal client. northdesk/workflows/ruff.toml re-allows Temporal there.
"northdesk/main.py" = ["TID251"]
"northdesk/api/**" = ["TID251"]
# The fake helpdesk is a separate service; the import rule protects northdesk only.
"helpdesk/**" = ["TID251"]
"tests/**" = ["S101", "TID251"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
asyncio_debug = true
strict = true
