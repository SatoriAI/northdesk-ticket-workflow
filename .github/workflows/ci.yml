name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.12"
      - run: uv sync --locked
      # end-of-file, whitespace and file-format hygiene, ruff and mypy, on every file
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      # ruff (import bans included), the format check, mypy --strict and pytest
      - run: make check

  offline-tests:
    name: tests with networking off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make test-offline
