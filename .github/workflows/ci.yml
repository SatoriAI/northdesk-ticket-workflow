name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A run on demand, e.g. to check main after a runner-image change, without a dummy commit.
  workflow_dispatch:

# The token reads the repository and nothing else; no job here writes anywhere.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA (tags can be moved); Dependabot keeps the pins current.
jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    # The tests run on Temporal's time-skipping server; a stalled one would otherwise hold the job for 6 hours.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; left on disk the token is readable by every later step.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The same uv as the Dockerfile's image, so CI and the image resolve alike.
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The hook environments (pre-commit-hooks); keyed on the config, which decides which exist.
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --locked

      # The pre-commit hooks on every file (hygiene, ruff with the import bans, mypy), then pytest with coverage.
      - name: Run the gate
        run: make check

      # Defaults to fail_ci_if_error: false, so a Codecov outage cannot turn a green build red.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  offline-tests:
    name: tests with networking off
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests in the image without a network
        run: make test-offline
