name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.12"
      - run: uv sync --locked
      # the pre-commit hooks on every file (hygiene, ruff with the import bans, mypy), then pytest with coverage
      - run: make check

  offline-tests:
    name: tests with networking off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make test-offline
