# The LLM clients: the only place the provider SDK may be imported.
# This table REPLACES the root banned-api table: it repeats every root ban except the ones this directory
# lifts, listed in EXEMPT in tests/unit/test_import_rules.py (which checks it).
extend = "../../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Only northdesk/main.py and northdesk/api/ may import FastAPI."
"starlette".msg = "Only northdesk/main.py and northdesk/api/ may import Starlette."
"temporalio".msg = "LLM clients know nothing of Temporal; the decide activity wraps them."
"northdesk.api".msg = "LLM clients know nothing of HTTP or Temporal."
"northdesk.main".msg = "LLM clients know nothing of HTTP or Temporal."
"northdesk.workflows".msg = "LLM clients know nothing of Temporal; the worker passes settings in."
