# Workflows and activities are the Temporal layer: Temporal is allowed here, FastAPI still is not.
# This table REPLACES the root banned-api table: it repeats every root ban except the ones this directory
# lifts, listed in EXEMPT in tests/unit/test_import_rules.py (which checks it).
extend = "../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Only northdesk/main.py and northdesk/api/ may import FastAPI."
"starlette".msg = "Only northdesk/main.py and northdesk/api/ may import Starlette."
"anthropic".msg = "Only northdesk/clients/llm/ may import the LLM provider SDK."
"pydantic".msg = "Workflow inputs, outputs and state are dataclasses; Pydantic stays in api/ and settings."
"northdesk.api".msg = "Workflows must not import the HTTP layer (it would pull FastAPI into the worker)."
"northdesk.main".msg = "Workflows must not import the API composition root."
"northdesk.clients.llm.anthropic_client".msg = "Use the LlmClient contract (clients/llm/base.py); factory.py builds the client."
