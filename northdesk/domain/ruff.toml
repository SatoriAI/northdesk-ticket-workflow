# The domain is pure: dataclasses and rules, no frameworks, no I/O, no other northdesk layers.
# This table REPLACES the root banned-api table, so it repeats the root bans.
extend = "../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "The domain must not depend on FastAPI."
"starlette".msg = "The domain must not depend on Starlette."
"temporalio".msg = "The domain must not depend on Temporal."
"anthropic".msg = "The domain must not depend on the LLM provider."
"httpx".msg = "The domain does no I/O."
"pydantic".msg = "Domain types are dataclasses."
"pydantic_settings".msg = "The domain reads no settings; values are passed in."
"northdesk.api".msg = "The domain must not import other northdesk layers."
"northdesk.workflows".msg = "The domain must not import other northdesk layers."
"northdesk.clients".msg = "The domain must not import other northdesk layers."
"northdesk.data".msg = "The domain must not import other northdesk layers."
"northdesk.main".msg = "The domain must not import other northdesk layers."
"northdesk.settings".msg = "The domain reads no settings; values are passed in."
"northdesk.log".msg = "The domain does not log; its callers do."
"northdesk.agent".msg = "The domain must not import other northdesk layers."
"helpdesk".msg = "The domain must not depend on the helpdesk service."
# Rules run inside the workflow but are imported pass-through, so the Temporal sandbox does not check them.
# These bans keep them deterministic: anything time- or randomness-dependent is passed in as a parameter
# (from the workflow, workflow.now() and workflow.random()).
"datetime.datetime.now".msg = "Rules run in the workflow: take the time as a parameter (workflow.now())."
"datetime.datetime.today".msg = "Rules run in the workflow: take the time as a parameter (workflow.now())."
"datetime.datetime.utcnow".msg = "Rules run in the workflow: take the time as a parameter (workflow.now())."
"datetime.date.today".msg = "Rules run in the workflow: take the date as a parameter (workflow.now())."
"time".msg = "Rules run in the workflow: take the time as a parameter (workflow.now())."
"random".msg = "Rules run in the workflow and must be deterministic."
"secrets".msg = "Rules run in the workflow and must be deterministic."
"uuid".msg = "Rules run in the workflow and must be deterministic (workflow.uuid4() in the workflow)."
"os".msg = "Rules are pure: no environment, files or processes."
"logging".msg = "Rules run inside the workflow; a log line here would repeat on every replay. Callers log."
"pathlib".msg = "Rules are pure: no files."
