"northdesk.api".msg = "The domain must not import other northdesk layers."
"northdesk.workflows".msg = "The domain must not import other northdesk layers."
"northdesk.clients".msg = "The domain must not import other northdesk layers."
"northdesk.data".msg = "The domain must not import other northdesk layers."
